name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Creator contract gate: the ecosystem & license matrix (CREATOR-001) must
  # stay complete and license-safe. Extended as creator plugins come online.
  creator-contract:
    name: creator contract (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js (type-stripping capable)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate creator ecosystem matrix
        run: node scripts/creator-ecosystem-check.ts

      - name: Lint creator skills (CREATOR-014)
        run: node scripts/creator-skill-lint.ts
